[project]
name = "segue"
version = "0.1.0"
description = "Segue connection engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "aiokafka>=0.11",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "itsdangerous>=2.2",
    "pyyaml>=6",
    "typesafe-sdk>=0.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "fakeredis>=2.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["segue*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
